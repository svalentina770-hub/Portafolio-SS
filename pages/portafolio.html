<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mochi | Proyectos</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
    <div class="header-inner">

        <a href="../index.html" class="logo">
            <img class="logo-icon" src="../assets/logo mochi.png" />
            <span>Mochi</span>
        </a>

        <button class="menu-btn" aria-label="Abrir menú">
            <span></span><span></span><span></span>
        </button>

        <nav class="main-nav">
            <a href="../index.html" class="nav-link">Inicio</a>
            <a href="./portafolio.html" class="nav-link active">Proyectos</a>
            <a href="./Sobre_mi.html" class="nav-link">Sobre mí</a>
            <a href="./Contactenos.html" class="nav-link">Contacto</a>
        </nav>

    </div>
</header>

<main class="portfolio-main">

<!-- ================= PROYECTOS ================= -->
<section class="portfolio-white-area">
<div class="container">

<h1 class="section-title big-title">Proyectos</h1>

<div class="portfolio-carousel">

    <button class="portfolio-card"
        data-type="project"
        data-title="Proyecto ECG"
        data-description="Creación y diseño de un sistema interactivo de enseñanza de la colocación de los electrodos dentro de un paciente"
        data-image1="../assets/Proyectos/UGc/1.png"
        data-image2="../assets/Proyectos/UGc/2.png"
        data-image3="../assets/Proyectos/UGc/3.png"
        data-image4="../assets/Proyectos/UGc/4.png">

        <img src="../assets/Proyectos/UGc/1.png" alt="ECG">
    </button>

    <button class="portfolio-card"
        data-type="project"
        data-title="Challenge Render"
        data-description="Este proyecto se da por varios retos para la creación de render, aplicación de texturas, integracion de luces y sombras"
        data-image1="../assets/Proyectos/render/1.jpg"
        data-image2="../assets/Proyectos/render/2.jpg"
        data-image3="../assets/Proyectos/render/3.jpg"
        data-image4="../assets/Proyectos/render/4.jpg">

        <img src="../assets/Proyectos/render/1.jpg" alt="Render">
    </button>

    <button class="portfolio-card featured"
        data-type="project"
        data-title="Sveliaty"
        data-description="Diseño y desarrollo de un sistema de combate por turnos estilo RPG, con enfoque en progresión del jugador, creando a partir de un juego analogo, pasando este a un formato digital. participando principalmente en este como la Diseñadora UI/UX"
        data-image1="../assets/Proyectos/Sveliaty/1.png"
        data-image2="../assets/Proyectos/Sveliaty/2.png"
        data-image3="../assets/Proyectos/Sveliaty/3.png"
        data-image4="../assets/Proyectos/Sveliaty/4.png">

        <img src="../assets/Proyectos/Sveliaty/prototipo 0602.jpg" alt="Sveliaty">
    </button>

    <button class="portfolio-card"
        data-type="project"
        data-title="Nux Interactive"
        data-description="Proyecto basado en la creación de una marca llamado Nux, su manual de marca, logo, mockups, identidad visual."
        data-image1="../assets/nux/1.png"
        data-image2="../assets/nux/2.png"
        data-image3="../assets/nux/3.png"
        data-image4="../assets/nux/4.png">

        <img src="../assets/nux/4.png" alt="Nux">
    </button>

    <button class="portfolio-card"
        data-type="project"
        data-title="Treegimon"
        data-description="Proyecto de un juego, con el objetivo de conocer plantas dentro de la universidad, fomentar su cuiado, para al momento de crecer poder luchar contra otros jugadores para conseguir mas plantas y luego derrotar a los jefes de cada zona. Encargada de La UI/UX y creación del terreno"
        data-image1="../assets/treegimon/1.png"
        data-image2="../assets/treegimon/2.png"
        data-image3="../assets/treegimon/3.png"
        data-image4="../assets/treegimon/4.png">

        <img src="../assets/treegimon/preview.png" alt="Treegimon">
    </button>
    <button class="portfolio-card"
        data-type="project"
        data-title="Whispers in Letter"
        data-description="Proyecto como juego educativo, para encender el pensamiento critico y filosofico de los estudiantes, mediante cartas y enseñanzas. Encargada de la UI/UX y diseño de la misma"
        data-image1="../assets/sohpia/1.png"
        data-image2="../assets/sohpia/2.png"
        data-image3="../assets/sohpia/3.png"
        data-image4="../assets/sohpia/4.png">

        <img src="../assets/sophia.png" alt="ECG">
    </button>

</div>

<!-- PANEL PROYECTOS -->
<article id="projectInfo" class="portfolio-info-panel white-info">

    <div class="info-gallery">
        <img data-thumb>
        <img data-thumb>
        <img data-thumb>
        <img data-thumb>
    </div>

    <div class="info-content">
        <h2 data-dynamic-title>Proyecto</h2>
        <p data-dynamic-description>Selecciona un proyecto.</p>
    </div>

</article>

</div>
</section>

<!-- ================= MODELOS 3D ================= -->
<section class="portfolio-models">
<!-- Forma orgánica superior --> 
<svg class="organic-divider organic-top" viewBox="0 0 1440 160" preserveAspectRatio="none" aria-hidden="true">
 <path d="M0,78 C140,24 300,20 475,56 C640,90 780,126 960,126 C1145,126 1280,82 1440,36 L1440,0 L0,0 Z">

 </path> 
</svg>
<div class="container">

<h2 class="section-title big-title">Modelos 3D</h2>

<div class="portfolio-carousel">

    <button class="portfolio-card featured"
        data-type="model"
        data-title="Steampunk Cat"
        data-description="Modelo de un gato inspirado en la estetica Steampunk, creado en maya y texturizado en Adobe Substance.  "
        data-model-type="sketchfab"
        data-model="https://sketchfab.com/models/07e2dc5907be41b78f1b84b14b277bc0/embed">

        <img src="../assets/gatito.png">
    </button>

    <button class="portfolio-card"
        data-type="model"
        data-title="Quimera"
        data-description="Modelo inspirado en la Quimera, una creatura mitica del manual de Dungeons and Dragons. Creado en maya y texturizado en Adobe Substance. "
        data-model-type="sketchfab"
        data-model="https://sketchfab.com/models/2e865f122579477a810e0de9ca30cbc2/embed?autostart=1">

        <img src="../assets/quimera.jpg">
    </button>

   <button class="portfolio-card"
        data-type="model"
        data-title="Old TV"
        data-description="Modelo inspirado en un televisor antiguo, creado en maya y texturizado en Adobe Substance. "
        data-model-type="sketchfab"
        data-model="https://sketchfab.com/models/73a09c694c974bc9bdb85a0322c4ff19/embed">

        <img src="../assets/tv.png">
    </button>
    <button class="portfolio-card"
        data-type="model"
        data-title="Rocky"
        data-description="Modelo inspirado en mi perrito Rocky, un pequeño pincher de 4 añitos. Creado en maya y texturizado en Adobe Substabce"
        data-model-type="local"
        data-model="../assets/modelos/rocky.glb"
        data-ar="rocky-ar.html">

        <img src="../assets/perrito.png">
    </button>
    <!-- ================= OTROS MODELOS (IMÁGENES) ================= -->

    <button class="portfolio-card"
        data-type="image"
        data-title="Otros modelos"
        data-description="Una selección de modelos adicionales realizados como práctica de exploración 3D y diseño."
        data-image1="../assets/otros/modelo1.jpg"
        data-image2="../assets/otros/modelo2.jpg"
        data-image3="../assets/otros/modelo3.png"
        data-image4="../assets/otros/modelo4.png">

        <img src="../assets/otros/modelo4.png">

    </button>
</div>

<!-- PANEL MODELOS -->
<article id="modelInfo" class="portfolio-info-panel pink-info">
    <div class="gallery-images">

    <img data-thumb>
    <img data-thumb>
    <img data-thumb>
    <img data-thumb>

</div>
    <!-- VISOR -->
    <div class="gallery-model hidden">

        <iframe id="sketchfabViewer"></iframe>

        <model-viewer
            id="localViewer"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            exposure="1"
            touch-action="pan-y"
            style="
                display:none;
                width:100%;
                height:450px;
                background:#f7f7f7;
                border-radius:20px;">
        </model-viewer>

    </div>

    <div class="info-content">
        <h2 data-dynamic-title>Modelo 3D</h2>
        <p data-dynamic-description>Selecciona un modelo.</p>

        <button
            id="arButton"
            class="btn btn-light"
            style="display:none;"
            onclick="window.open('../assets/ar/rocky_ar.html', '_blank')">
             Ver en Realidad Aumentada
        </button>
    </div>

</article>

</div>
</section>

</main>

<!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <a href="./index.html" class="logo footer-logo">
                <img class="logo-icon" src="../assets/logo mochi.png" />
                <span>Mochi</span>
            </a>

            <nav class="footer-nav">
                <a href="./index.html">Inicio</a>
                <a href="./pages/portafolio.html">Proyectos</a>
                <a href="./pages/Sobre_mi.html">Sobre mí</a>
                <a href="./pages/Contactenos.html">Contacto</a>
            </nav>
        </div>
    </footer>

<script src="../js/main.js"></script>

<!-- MODEL VIEWER -->
<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

</body>
</html>
